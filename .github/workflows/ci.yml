name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # 1. SQL lint: SQLFluff enforces our .sqlfluff config (BigQuery dialect,
  #    uppercase keywords, explicit aliasing, column ordering, 120-col lines).
  #    Fails the build on any rule violation.
  # ---------------------------------------------------------------------------
  sql-lint:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLFluff
        run: pip install "sqlfluff==4.3.0"
      - name: Lint
        run: sqlfluff lint sql/

  # ---------------------------------------------------------------------------
  # 2. SQL format check: fails if any file isn't already canonically formatted,
  #    so PRs must arrive pre-formatted (run `sqlfluff format sql/` locally).
  # ---------------------------------------------------------------------------
  sql-format:
    name: SQL format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLFluff
        run: pip install "sqlfluff==4.3.0"
      - name: Format check (no diff expected)
        run: |
          sqlfluff format sql/
          git diff --exit-code -- sql/ \
            || { echo "::error::SQL is not formatted. Run 'sqlfluff format sql/' and commit."; exit 1; }

  # ---------------------------------------------------------------------------
  # 3. SQL typecheck: a BigQuery *dry run* validates every table/column/type
  #    reference without running the query or billing bytes. Runs only after
  #    lint + format pass. Gated on a GCP credential secret — skips gracefully
  #    (green) on forks / when unset so the build never blocks on missing
  #    secrets.
  # ---------------------------------------------------------------------------
  sql-typecheck:
    name: SQL dry-run typecheck (BigQuery)
    needs: [sql-lint, sql-format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for GCP credentials
        id: creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY not set — skipping BigQuery dry-run typecheck."
          fi

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud / bq
        if: steps.creds.outputs.available == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Dry-run every statement
        if: steps.creds.outputs.available == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: bash sql/dryrun.sh sql/part1_queries.sql "$GOOGLE_CLOUD_PROJECT"
